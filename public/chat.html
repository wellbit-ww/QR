<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Чат поддержки оборудования</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css?v=20260811" />
  </head>
  <body class="layout-chat">
    <main class="page page--chat">
      <section class="card card--chat">
        <header class="chat-header" id="chatHeader">
          <a
            class="chat-back-link chat-back-link--topbar"
            id="backToEquipmentLink"
            href="/equipment/sdb702-nm"
          >
            <span class="chat-back-link__icon" aria-hidden="true">←</span>
            <span class="chat-back-link__label">Назад</span>
          </a>
          <button
            type="button"
            class="chat-header-toggle"
            id="chatHeaderToggle"
            aria-expanded="true"
            aria-controls="chatHeaderDetails"
            title="Свернуть шапку"
          >
            <span class="chat-header-toggle__icon" aria-hidden="true"></span>
          </button>
          <div class="chat-header__details" id="chatHeaderDetails">
            <a href="/" class="site-logo site-logo--compact chat-header-logo" aria-label="SOVTEST — на главную">
              <img
                class="site-logo__img"
                src="/sovtest-logo.png?v=4"
                alt="SOVTEST"
                width="160"
                height="48"
                decoding="async"
              />
            </a>
            <h1 class="chat-title">Чат</h1>
            <div class="equipment-badge" id="equipmentBadge">
              Оборудование: не выбрано
            </div>
            <p class="chat-subtitle" id="chatSubtitle"></p>
          </div>
        </header>

        <section class="chat-shell" aria-label="Диалог с SOVA">
          <div class="chat-messages" id="chatMessages"></div>

          <form class="chat-form" id="chatForm">
            <button
              type="button"
              class="chat-support-button"
              id="chatSupportButton"
              hidden
              aria-label="Запрос в поддержку"
            >
              <svg
                class="chat-support-button__icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path
                  fill="currentColor"
                  d="M12 1a9 9 0 0 0-9 9v4a3 3 0 0 0 3 3h1v-6H5a7 7 0 1 1 14 0h-2v6h1a3 3 0 0 0 3-3v-4a9 9 0 0 0-9-9Zm-1 14v3a1 1 0 0 0 2 0v-3h-2Z"
                />
              </svg>
              <span class="chat-support-button__label">Поддержка</span>
            </button>
            <div class="chat-compose">
              <div class="chat-input-wrap">
                <textarea
                  class="chat-input"
                  id="chatInput"
                  name="message"
                  rows="2"
                  placeholder="Введите ваш запрос..."
                  required
                ></textarea>
                <button
                  class="chat-submit-button"
                  type="submit"
                  aria-label="Отправить вопрос"
                  title="Отправить вопрос"
                >
                  <svg
                    class="chat-submit-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                  >
                    <path
                      d="M3.4 11.2 19.6 4.5c.9-.4 1.8.5 1.4 1.4l-6.7 16.2c-.4.9-1.7.8-1.9-.1l-1.5-6-6-1.5c-.9-.2-1-.5-.1-1.3Z"
                      fill="currentColor"
                    />
                  </svg>
                </button>
              </div>
            </div>
          </form>
        </section>

      </section>
    </main>

    <footer class="footer footer--chat"><span class="footer-brand">SOVTEST</span></footer>

    <script src="/cookie-consent.js?v=20260811"></script>
    <script src="/support-modal.js" defer></script>
    <script src="/vendor/marked.min.js" defer></script>
    <script src="/vendor/purify.min.js" defer></script>
    <script src="/chat.js" defer></script>
  </body>
</html>
