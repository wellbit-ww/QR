<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Вход — портал сервисной поддержки SOVTEST</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css?v=20261111p" />
  </head>
  <body class="layout-login">
    <main class="login-shell">
      <section class="login-shell__brand" aria-label="О портале">
        <div class="login-shell__logo" id="loginBrand"></div>
        <h1 class="login-shell__title">Портал сервисной поддержки</h1>
        <p class="login-shell__lead">
          Быстрый доступ к знаниям и технической поддержке вашего оборудования
        </p>
        <span class="login-shell__rule" aria-hidden="true"></span>
      </section>

      <section class="card card--login login-card">
        <p class="login-hint" id="loginHint">
          Введите логин и пароль с наклейки для доступа к порталу
        </p>

        <form class="login-form" id="loginForm" novalidate>
          <label class="login-field">
            <span class="login-label">Логин</span>
            <input
              class="login-input"
              id="loginInput"
              name="login"
              type="text"
              autocomplete="username"
              inputmode="text"
              required
            />
          </label>
          <label class="login-field">
            <span class="login-label">Пароль</span>
            <span class="login-password-wrap">
              <input
                class="login-input login-input--password"
                id="passwordInput"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              />
              <button
                class="login-password-toggle"
                type="button"
                id="passwordToggle"
                aria-label="Показать пароль"
                aria-pressed="false"
              >
                <svg
                  class="login-password-toggle__icon login-password-toggle__icon--show"
                  viewBox="0 0 24 24"
                  width="22"
                  height="22"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path
                    fill="currentColor"
                    d="M12 5c-5.5 0-9.5 4.5-10.8 6.2a1.2 1.2 0 0 0 0 1.6C2.5 14.5 6.5 19 12 19s9.5-4.5 10.8-6.2a1.2 1.2 0 0 0 0-1.6C21.5 9.5 17.5 5 12 5zm0 12c-3.9 0-7.1-3.1-8.5-5C4.9 10.1 8.1 7 12 7s7.1 3.1 8.5 5c-1.4 1.9-4.6 5-8.5 5zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"
                  />
                </svg>
                <svg
                  class="login-password-toggle__icon login-password-toggle__icon--hide"
                  viewBox="0 0 24 24"
                  width="22"
                  height="22"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path
                    fill="currentColor"
                    d="M3.3 2.3 2 3.6l3.1 3.1C3.5 8.1 2.3 9.6 1.2 11a1.2 1.2 0 0 0 0 1.6C2.5 14.5 6.5 19 12 19c2 0 3.8-.6 5.3-1.4l3.1 3.1 1.3-1.3L3.3 2.3zM12 17c-3.9 0-7.1-3.1-8.5-5 .8-1.1 2.2-2.6 4.1-3.6l1.7 1.7A3 3 0 0 0 12 15c.5 0 1-.1 1.4-.3l1.6 1.6c-.9.4-1.9.7-3 .7zm8.8-4.2c-.5.7-1.2 1.5-2.1 2.3l-1.5-1.5c.8-.6 1.5-1.3 2-2.1C16.9 9.6 14.6 7 12 7c-.5 0-1 .1-1.5.2L8.9 5.6C9.8 5.2 10.9 5 12 5c5.5 0 9.5 4.5 10.8 6.2a1.2 1.2 0 0 1 0 1.6z"
                  />
                </svg>
              </button>
            </span>
          </label>
          <p class="login-error" id="loginError" role="alert" hidden></p>
          <button
            class="action-button login-submit"
            type="submit"
            id="loginSubmit"
          >
            <span class="login-submit__label">Войти</span>
          </button>
        </form>
      </section>
    </main>

    <footer class="footer footer--login">
      <span class="footer-brand">SOVTEST</span>
      <span class="footer-sep" aria-hidden="true">|</span>
      <span class="footer-note">Сервисный портал</span>
    </footer>

    <script src="/cookie-consent.js?v=20260811"></script>
    <script src="/site-brand.js?v=20261111n"></script>
    <script src="/login.js?v=20261111n"></script>
  </body>
</html>
