<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Вход — поддержка оборудования</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css?v=20261111b" />
  </head>
  <body class="layout-login">
    <main class="page page--login">
      <header class="login-top-brand" aria-label="SOVTEST">
        <div id="loginBrand"></div>
        <p class="login-portal-desc">
          Портал сервисной поддержки оборудования SOVTEST.
          Здесь можно быстро получить ответы по эксплуатации, инструкции
          и связаться с техподдержкой — по логину с наклейки на оборудовании.
        </p>
      </header>
      <section class="card card--login">
        <h1>Вход</h1>
        <p class="login-hint" id="loginHint">
          Введите логин и пароль с наклейки на оборудовании.
        </p>

        <form class="login-form" id="loginForm" novalidate>
          <label class="login-field">
            <span class="login-label">Логин</span>
            <input
              class="login-input"
              id="loginInput"
              name="login"
              type="text"
              autocomplete="username"
              required
            />
          </label>
          <label class="login-field">
            <span class="login-label">Пароль</span>
            <span class="login-password-wrap">
              <input
                class="login-input login-input--password"
                id="passwordInput"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              />
              <button
                class="login-password-toggle"
                type="button"
                id="passwordToggle"
                aria-label="Показать пароль"
                aria-pressed="false"
              >
                Показать
              </button>
            </span>
          </label>
          <p class="login-error" id="loginError" hidden></p>
          <button class="action-button login-submit" type="submit" id="loginSubmit">
            Войти
          </button>
        </form>
      </section>
    </main>

    <footer class="footer"><span class="footer-brand">SOVTEST</span></footer>
    <script src="/cookie-consent.js?v=20260811"></script>
    <script src="/site-brand.js"></script>
    <script src="/login.js"></script>
  </body>
</html>
